- name: org_0101digitall.public_academic_bag
  grain:
  - id
  columns:
  - name: id
    type: text
    nullable: true
  - name: learner_id
    type: text
    nullable: true
    description: FK to public_learners.id — use for JOIN only; display learner_name instead
  - name: enrollment_id
    type: text
    nullable: true
  - name: bag_status
    type: bigint
    nullable: true
    description: 1=Open, 2=Submitted, 3=Approved
  - name: is_active
    type: boolean
    nullable: true
    description: true = active bag
  - name: created_at
    type: timestamp with time zone
    nullable: true
  - name: updated_at
    type: timestamp with time zone
    nullable: true
  - name: created_by
    type: text
    nullable: true
  - name: updated_by
    type: text
    nullable: true
  - name: max_subjects
    type: bigint
    nullable: true
  - name: min_subjects
    type: bigint
    nullable: true
  - name: gross_price
    type: double precision
    nullable: true
    description: Fee before discounts. Use SUM(gross_price) for gross revenue / gross fees. NOT cash collected
      — cash is payment_details.amount with payment_status=3.
  - name: gst_per
    type: double precision
    nullable: true
  - name: gst_total
    type: double precision
    nullable: true
  - name: net_price
    type: double precision
    nullable: true
    description: Booked bag fee (TEXT often) — NOT cash revenue; COALESCE(::numeric,0) for averages
  - name: overall_discount_total
    type: double precision
    nullable: true
  - name: taxable_price
    type: double precision
    nullable: true
  - name: payment_status
    type: bigint
    nullable: true
    description: 1=WaitingForPayment 2=PaymentInProgress 3=PaymentCompleted 4=PaymentFailed 5=InstallmentSetupPending
      6=InstallmentSetupCompleted 7=InstallmentDebited 8=InstallmentSetupActive 9=InstallmentSetupFailed
      10=InstallmentSetupCancelled 11=InstallmentSetupBounced. PaymentCompleted=3 is fully paid; 8=active
      installment plan (not installment_payment.is_active).
  - name: admission_type_id
    type: text
    nullable: true
  - name: total_commitment_amount
    type: double precision
    nullable: true
  - name: bag_type
    type: bigint
    nullable: true
    description: 1=Regular, 2=AddOn
  - name: step_progress
    type: text
    nullable: true
  - name: applicable_for
    type: text
    nullable: true
