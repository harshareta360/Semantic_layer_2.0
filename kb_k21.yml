  sql: org_0101digitall.public_master_list_value.list_id = 'be0ac7ab-ff1b-4916-8281-3933582ff2d4' AND
    org_0101digitall.public_master_list_value.parent_value_id IS NOT NULL
  description: 'Rows of the shared lookup table that are states: in the geography list, under a country.'
- name: is_country
