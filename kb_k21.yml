  agg: min
  recorded_per:
  - org_0101digitall.public_learner_enrollment.id
  synonyms:
  - first enrollment date
  description: Date of the earliest enrollment.
- name: days_to_first_payment
  entity: Learner
  formula: first_payment_date - first_enrollment_date
  per_record: true
  unit: days
  synonyms:
  - days to first payment
  - days between enrollment and first payment
  description: Calendar days from the first enrollment to the first payment.
- name: outstanding
  entity: Learner
  formula: total_bag_net_value - total_revenue
  per_record: true
  synonyms:
  - outstanding
  - amount outstanding
  - balance due
  description: Bag value billed minus revenue collected.
- name: collection_rate
  entity: Learner
  formula: total_revenue / total_bag_net_value
  synonyms:
  - collection rate
  description: Revenue collected as a share of bag value billed.
