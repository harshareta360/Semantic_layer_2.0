    = '')
  polarity: include
  synonyms:
  - missing tracking
  - no tracking
  - no tracking id
  - tracking missing
  - tracking ids missing
  - blank tracking
  - without tracking id
  - missing tracking id
  description: Shipments with no tracking ID (NULL or blank).
- name: is_state
