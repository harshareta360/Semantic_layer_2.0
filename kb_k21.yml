conditions:
- name: active_installment_plan
  scope: BagInstallment
  sql: org_0101digitall.public_academic_bag_installment.is_active = TRUE AND COALESCE(org_0101digitall.public_academic_bag_installment.is_draft,
    FALSE) = FALSE
  polarity: include
  synonyms:
  - active installment plan
  description: Active non-draft installment plans.
- name: missing_tracking_id
  scope: LogisticsShipment
