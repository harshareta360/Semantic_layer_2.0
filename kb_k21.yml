- name: total_revenue
  entity: Payment
  sql: CASE WHEN org_0101digitall.public_payment_details.payment_status::integer = 3 AND EXISTS (SELECT
    1 FROM org_0101digitall.public_academic_bag AS req WHERE org_0101digitall.public_payment_details.academic_bag_id
    = req.id) THEN org_0101digitall.public_payment_details.amount::numeric END
  agg: sum
  recorded_per:
  - org_0101digitall.public_payment_details.id
  synonyms:
  - revenue
  - fees collected
  - collections
  - income
  - sales
  - cash received
  - total revenue
  description: Cash collected — SUM(payment_details.amount).
