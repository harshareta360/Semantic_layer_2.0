- name: org_0101digitall.public_academic_bag_items
  grain:
  - id
  columns:
  - name: id
    type: text
    nullable: true
  - name: academic_bag_id
    type: text
    nullable: true
  - name: product_line_id
    type: text
    nullable: true
  - name: product_name
    type: text
    nullable: true
  - name: product_line_price
    type: double precision
    nullable: true
  - name: quantity
    type: double precision
    nullable: true
  - name: gross_price
    type: double precision
    nullable: true
    description: Pre-discount line gross amount
  - name: discount_id
    type: text
    nullable: true
  - name: discount_name
    type: text
    nullable: true
    description: Optional discount label on the line item
  - name: discount_value
    type: double precision
    nullable: true
    description: 'Raw magnitude: percent points when discount_type=1, currency when type=2, ignored when
      type IS NULL. Discount amount = CASE type WHEN 1 THEN gross*value/100 WHEN 2 THEN value ELSE 0 END.'
  - name: taxable_price
    type: double precision
    nullable: true
  - name: gst_per
    type: double precision
    nullable: true
  - name: gst_amount
    type: double precision
    nullable: true
  - name: net_price
    type: double precision
    nullable: true
    description: Booked line value AFTER discount — prefer for item totals. Do not re-apply discount_type/discount_value
      on top of net_price.
  - name: is_mandatory
    type: boolean
    nullable: true
    description: TRUE = mandatory line item (required; cannot be removed from bag); FALSE = optional
  - name: is_active
    type: boolean
    nullable: true
    description: TRUE = active line-item row; FALSE = inactive. Prefer is_active=TRUE for totals. Not
      the same as AcademicBag.is_active or bag payment_status=8 (installment active).
  - name: created_at
    type: timestamp with time zone
    nullable: true
  - name: updated_at
    type: timestamp with time zone
    nullable: true
  - name: created_by
    type: text
    nullable: true
  - name: updated_by
    type: text
    nullable: true
  - name: max_quantity
    type: double precision
    nullable: true
  - name: min_quantity
    type: double precision
    nullable: true
  - name: is_qty_based
    type: boolean
    nullable: true
  - name: discount_type
    type: bigint
    nullable: true
    description: 1=Percentage (% of gross_price), 2=Absolute (currency), NULL=no discount. Controls how
      discount_value is interpreted.
  - name: commitment_amount
    type: double precision
    nullable: true
  - name: selected_qty
    type: double precision
    nullable: true
  - name: is_shippable_item
    type: boolean
    nullable: true
