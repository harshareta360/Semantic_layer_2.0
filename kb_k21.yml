- name: item_discount_total
  entity: BagItem
  sql: CASE org_0101digitall.public_academic_bag_items.discount_type::integer WHEN 1 THEN COALESCE(org_0101digitall.public_academic_bag_items.gross_price::numeric,
    0) * COALESCE(org_0101digitall.public_academic_bag_items.discount_value::numeric, 0) / 100.0 WHEN
    2 THEN COALESCE(org_0101digitall.public_academic_bag_items.discount_value::numeric, 0) ELSE 0 END
  agg: sum
  recorded_per:
  - org_0101digitall.public_academic_bag_items.id
  synonyms:
  - discount amount
  - total discount
  - discounts given
  - line discount
  - item discount total
  description: Total discount amount on bag line items. Interprets discount_value by discount_type.
